group = "dev.britannio.in_app_review"
version = "1.0-SNAPSHOT"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

// VENDORED COPY of in_app_review 2.0.12.
//
// Upstream applies the legacy Kotlin Gradle Plugin (KGP) unconditionally and
// pins KGP 2.1.0 + AGP 8.7.3 on its buildscript classpath; both are removed/
// incompatible with AGP 9. This copy instead relies on AGP 9's built-in Kotlin
// (`android.builtInKotlin=true` in the app's gradle.properties): the .kt
// sources under src/main/kotlin are compiled by AGP itself, and the Kotlin
// JVM target follows android.compileOptions below. The legacy Kotlin plugin is
// therefore never requested here — Flutter's KGP detection scans build script
// *text*, so the apply line must not exist in any form.
// Upstream equivalent: britannio/in_app_review#179. Once a pub.dev release
// ships the migration, this directory can be deleted and the path dependency
// in the app's pubspec.yaml restored to the hosted constraint.

android {
    namespace = "dev.britannio.in_app_review"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
        // Release notes: https://developer.android.com/reference/com/google/android/play/core/release-notes-in_app_reviews
        implementation 'com.google.android.play:review:2.0.2'
        implementation 'com.google.android.play:review-ktx:2.0.2'
        // Release notes: https://developers.google.com/android/guides/releases
        implementation 'com.google.android.gms:play-services-base:18.7.2'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
